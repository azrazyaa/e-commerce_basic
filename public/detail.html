<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Panggil detail.js Anda di sini -->
  <script defer src="../script/detail.js"></script>
</head>
<body class="bg-white font-sans">

  <!-- Header -->
  <nav class="sticky top-0 z-50">
    <header class="bg-[#D9EAFD] shadow p-4 flex items-center justify-between relative">
      <!-- Logo -->
      <div class="flex items-center">
        <h1 class="text-xl font-semibold text-[#7f1d1d]">LaceLuxe</h1>
      </div>

      <!-- Search Bar (tengah) -->
      <div class="absolute left-1/2 transform -translate-x-1/2">
        <div class="relative">
          <input type="text" placeholder="Search" class="px-4 py-1 rounded-full border border-gray-300 w-80">
          <svg class="w-4 h-4 absolute top-1/2 right-3 -translate-y-1/2 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
          </svg>
        </div>
      </div>

      <!-- Cart & Profile -->
      <div class="flex items-center gap-4">
        <!-- Cart -->
        <div class="relative">
          <a href="chart.html" class="relative block">
            <img src="../img/keranjang.png" alt="Cart" class="w-6 h-6" />
            <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full px-1.5">0</span>
          </a>
        </div>
        <!-- Profile Button -->
        <div class="relative">
          <button onclick="toggleProfilePopup()" class="w-8 h-8 rounded-full overflow-hidden border-2 border-[#6b3030]">
            <img src="../img/3a6745f3-120e-4bd5-a701-d9deb1efbd86.jpeg" alt="Profil" class="w-full h-full object-cover" />
          </button>
        </div>
      </div>
    </header>
  </nav>

  <!-- Profile Popup -->
  <div id="profile-popup" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 hidden">
    <div class="bg-white rounded-2xl p-8 shadow-lg w-80 relative">
      <div class="flex flex-col items-center text-center">
        <img src="../img/3a6745f3-120e-4bd5-a701-d9deb1efbd86.jpeg" alt="Avatar" class="w-20 h-20 rounded-full -mt-14 border-4 border-white shadow" />
        <h2 class="text-lg font-semibold mt-4">zuramania1225</h2>
        <p class="text-sm text-gray-500">zuramania1225@gmail.com</p>
        <p class="text-sm mt-2">‪+62 89697627710‬</p>
        <p class="text-sm text-gray-600 mb-4 text-center">Jl. Cisanggarung2 Rt.03 Rw.01 No.200</p>
        <button onclick="logout()" class="bg-lime-200 hover:bg-lime-300 text-black font-semibold py-1 px-4 rounded-full">
          Log Out
        </button>
      </div>
    </div>
  </div>

  <div class="pt-20"></div>
  <div id="product"></div>

  <!-- Modal Checkout -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg w-[90%] max-w-md">
      <h2 class="text-lg font-bold mb-4">Checkout</h2>
      <p id="checkout-summary" class="mb-4"></p>
      <div class="flex justify-end gap-2">
        <button id="cancel-btn" class="bg-gray-300 px-4 py-2 rounded">Batal</button>
        <button id="confirm-btn" class="bg-[#6b3030] text-white px-4 py-2 rounded">Konfirmasi</button>
      </div>
    </div>
  </div>

  <!-- Popup Order Summary -->
  <div id="popup-order-summary" class="hidden fixed bottom-4 right-4 bg-green-100 text-green-800 px-4 py-2 rounded shadow-lg z-50">
    <span>Pesanan berhasil dibuat!</span>
    <button onclick="togglePopup()" class="ml-4 text-sm text-gray-600 hover:text-gray-800">Tutup</button>
  </div>

  <script src="../script/checkout.js"></script>
  <script src="../script/description.js"></script>
  <script>
    function toggleProfilePopup() {
      document.getElementById('profile-popup').classList.toggle('hidden');
    }
    function logout() {
      alert("Logged out");
      document.getElementById('profile-popup').classList.add('hidden');
    }
  </script>
</body>
</html>
