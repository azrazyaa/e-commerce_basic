<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center">

  <div class="flex max-w-6xl w-full p-6 gap-12 items-center">
    
    <!-- Gambar Ilustrasi -->
    <div class="w-1/2 flex justify-center">
      <img src="../img/fingerprint-33 1.png" alt="Illustration" class="max-w-full h-auto" />
    </div>

    <!-- Form Register -->
    <div class="w-1/2">
      <h2 class="text-3xl font-semibold mb-2">Register</h2>
      <p class="text-sm text-gray-600 mb-6">
        Already have an account?
        <a href="login.html" class="text-green-600 hover:underline">Login here</a>
      </p>

      <form class="space-y-4">
        <input type="email" placeholder="Email address" class="w-full border border-gray-300 px-4 py-2 rounded" />

        <div class="flex gap-2">
          <input type="text" value="+62" disabled class="w-20 border border-gray-300 px-4 py-2 rounded bg-gray-100 text-center" />
          <input type="tel" placeholder="Phone Number" class="flex-1 border border-gray-300 px-4 py-2 rounded" />
        </div>

        <input type="password" placeholder="Password" class="w-full border border-gray-300 px-4 py-2 rounded" />
        <input type="password" placeholder="Confirm Password" class="w-full border border-gray-300 px-4 py-2 rounded" />

        <a href="./home.html" class="block text-center w-full bg-[#7f1d1d] text-white px-4 py-2 rounded hover:bg-red-300 transition">
          Register
        </a>
      </form>
    </div>

  </div>

</body>
</html>
